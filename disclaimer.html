        if (typeof firebase === 'undefined' || !firebase.apps.length) return;
        const db = firebase.firestore();
        db.collection('pages').doc('disclaimer').get().then(doc => {
          const el = document.getElementById('disclaimerContent');
          const upd = document.getElementById('disclaimerUpdated');
          if (!doc.exists || !doc.data().content) {
            el.innerHTML = getDefaultDisclaimer();
            return;
          }
          const d = doc.data();
          el.innerHTML = d.content;
          if (d.updatedAt) {
            upd.textContent = 'अंतिम अपडेट: ' + new Date(d.updatedAt.seconds * 1000).toLocaleDateString('hi-IN');

          document.getElementById('disclaimerContent').innerHTML = getDefaultDisclaimer();
