<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="लाच्छरसर गाँव के बारे में — इतिहास, जनसांख्यिकी, भूगोल" />
  <title>गाँव के बारे में · लाच्छरसर</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Dynamic sections styles */
    .about-section-block {
      background: #fff;
      border-radius: 16px;
      padding: 1.75rem 2rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      margin-bottom: 1.5rem;
      border-left: 5px solid var(--accent, #ff9933);
      transition: all 0.25s;
    }
    .about-section-block:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .about-section-block h2 {
      color: var(--primary, #0c2340);
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Table type */
    .dyn-table { width: 100%; border-collapse: collapse; }
    .dyn-table tr { border-bottom: 1px dashed var(--border, #e2e8f0); }
    .dyn-table tr:last-child { border-bottom: none; }
    .dyn-table td { padding: 0.85rem 0.5rem; font-size: 0.95rem; vertical-align: top; }
    .dyn-table td:first-child { color: var(--text-muted, #64748b); font-weight: 600; width: 40%; }
    .dyn-table td:last-child { color: var(--primary, #0c2340); font-weight: 600; }

    /* List type */
    .dyn-list { list-style: none; padding: 0; margin: 0; }
    .dyn-list li {
      padding: 0.7rem 0;
      border-bottom: 1px dashed var(--border, #e2e8f0);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .dyn-list li:last-child { border-bottom: none; }
    .dyn-list li strong { color: var(--primary, #0c2340); font-weight: 700; }
    .dyn-list li span { color: var(--text-muted, #64748b); font-size: 0.9rem; }

    /* Cards type */
    .dyn-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .dyn-card {
      background: linear-gradient(135deg, #fff8ee, #ffe8cc);
      border-radius: 14px;
      padding: 1.25rem;
      text-align: center;
      border-left: 4px solid var(--accent, #ff9933);
    }
    .dyn-card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .dyn-card h4 { color: var(--primary, #0c2340); font-size: 1rem; font-weight: 800; margin: 0 0 0.35rem 0; }
    .dyn-card p { color: var(--text-muted, #64748b); font-size: 0.85rem; margin: 0; }

    /* HTML type */
    .dyn-html { line-height: 1.8; }

    /* Responsive */
    @media (max-width: 640px) {
      .about-section-block { padding: 1.35rem 1.25rem; }
      .dyn-table td:first-child { width: 50%; font-size: 0.85rem; }
      .dyn-table td:last-child { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'" />
        <span>लाच्छरसर</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">होम</a>
        <a href="about.html" class="active">गाँव के बारे में</a>
        <a href="panchayat.html">पंचायत</a>
        <a href="gallery.html">गैलरी</a>
        <a href="contact.html">संपर्क</a>
      </nav>
      <button class="hamburger" id="hamburger">☰</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="section-alt" style="padding: 3rem 1.25rem 2rem; text-align: center;">
    <h1 class="section-title" style="margin-bottom: 0.5rem;">लाच्छरसर के बारे में</h1>
    <p style="color: var(--text-muted, #64748b); font-size: 1rem; max-width: 620px; margin: 0 auto;">
      गाँव की पूरी जानकारी — इतिहास, जनसांख्यिकी, भूगोल, और भी बहुत कुछ।
    </p>
  </section>

  <!-- DYNAMIC SECTIONS -->
  <section class="section">
    <div class="section-container" id="aboutContainer">
      <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
        ⏳ Loading sections...
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <p>© 2026 लाच्छरसर ग्राम पंचायत · चूरू, राजस्थान</p>
      <div class="footer-links">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="disclaimer.html">Disclaimer</a>
        <a href="contact.html">Contact</a>
      </div>
      <p class="footer-sub">पिन कोड 331802 · रतनगढ़ तहसील · बीकानेर संभाग</p>
    </div>
  </footer>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="public-loader.js"></script>

  <script>
  (function () {
    'use strict';

    function init() {
      if (typeof firebase === 'undefined' || !firebase.apps.length) {
        setTimeout(init, 200);
        return;
      }

      const db = firebase.firestore();
      db.collection('site_content').doc('about').onSnapshot(function (doc) {
        if (!doc.exists || !doc.data().sections) {
          document.getElementById('aboutContainer').innerHTML =
            '<div style="text-align: center; padding: 3rem; color: var(--text-muted);">' +
            '📄 अभी कोई section नहीं है — admin panel से जोड़ें' +
            '</div>';
          return;
        }
        renderSections(doc.data().sections);
      }, function (err) {
        console.warn("About load error:", err);
      });
    }

    function renderSections(sections) {
      const container = document.getElementById('aboutContainer');
      const sorted = sections.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

      container.innerHTML = sorted.map(function (sec) {
        let body = '';

        if (sec.type === 'table') {
          body = '<table class="dyn-table">' +
            (sec.data.rows || []).map(function (r) {
              return '<tr><td>' + escapeHtml(r.key) + '</td><td>' + escapeHtml(r.value) + '</td></tr>';
            }).join('') +
          '</table>';
        }

        else if (sec.type === 'list') {
          body = '<ul class="dyn-list">' +
            (sec.data.items || []).map(function (it) {
              return '<li><strong>' + escapeHtml(it.name) + '</strong>' +
                (it.extra ? '<span>' + escapeHtml(it.extra) + '</span>' : '') +
              '</li>';
            }).join('') +
          '</ul>';
        }

        else if (sec.type === 'cards') {
          body = '<div class="dyn-cards">' +
            (sec.data.cards || []).map(function (c) {
              return '<div class="dyn-card">' +
                (c.icon ? '<div class="icon">' + escapeHtml(c.icon) + '</div>' : '') +
                '<h4>' + escapeHtml(c.name) + '</h4>' +
                (c.role ? '<p>' + escapeHtml(c.role) + '</p>' : '') +
              '</div>';
            }).join('') +
          '</div>';
        }

        else if (sec.type === 'html') {
          body = '<div class="dyn-html">' + (sec.data.html || '') + '</div>';
        }

        return '<div class="about-section-block">' +
          '<h2>' + escapeHtml(sec.title) + '</h2>' +
          body +
        '</div>';
      }).join('');
    }

    function escapeHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    document.getElementById('hamburger')?.addEventListener('click', function () {
      document.getElementById('navLinks').classList.toggle('open');
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

</body>
</html>
