  <script>
    document.getElementById('hamburger')?.addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    // Load privacy policy from Firestore
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (typeof firebase === 'undefined' || !firebase.apps.length) return;
        const db = firebase.firestore();
        db.collection('pages').doc('privacy').get().then(doc => {
          const el = document.getElementById('privacyContent');
          const upd = document.getElementById('privacyUpdated');
          if (!doc.exists || !doc.data().content) {
            el.innerHTML = getDefaultPrivacy();
            return;
          }
          const d = doc.data();
          el.innerHTML = d.content;
          if (d.updatedAt) {
            upd.textContent = 'अंतिम अपडेट: ' + new Date(d.updatedAt.seconds * 1000).toLocaleDateString('hi-IN');
          }
        }).catch(() => {
          document.getElementById('privacyContent').innerHTML = getDefaultPrivacy();
        });
      }, 400);
    });
